name: ci

# ローカルの `dev.py check` と同じゲートを CI でも実行する（Codex の blocking-ci と同じ考え方）。
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python scripts/dev.py check
      - name: Check for a clean worktree
        run: git diff --exit-code
