[project]
name = "cogexp"
version = "0.1.0"
description = "認知・判断・行動分析アプリ（Streamlit）"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.64",  # components v2（問題画面の部品）を使用
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
    "mypy>=1.18",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogexp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
# 日本語の文字列・コメントで全角記号を使うため
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
