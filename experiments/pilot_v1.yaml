# 予備実験 v1：表現（標準／言い換え）× 時間制限（なし／あり）
experiment_id: pilot_v1
title: 予備実験 v1
# 練習は割り当てられた条件と同じ時間設定・確信度設定で提示する
practice: [practice/choice@1, practice/numeric@1]
confidence_levels: 5
# 本課題の順序（リンダ先／バットとボール先）を条件ごとに均等化する
counterbalance_order: true
conditions:
  - condition_id: standard_nolimit
    factors: { wording: standard, time_limit: none }
    variants: [linda/standard@1, bat_ball/standard@1]

  - condition_id: standard_limit
    factors: { wording: standard, time_limit: limited }
    time_limit_sec: 15 # 2026-10-02 決定。予備実験の読解時間で妥当性を確認する
    show_countdown: true
    variants: [linda/standard@1, bat_ball/standard@1]

  - condition_id: reworded_nolimit
    factors: { wording: reworded, time_limit: none }
    variants: [linda/frequency@1, bat_ball/explicit@1]

  - condition_id: reworded_limit
    factors: { wording: reworded, time_limit: limited }
    time_limit_sec: 15 # 2026-10-02 決定。予備実験の読解時間で妥当性を確認する
    show_countdown: true
    variants: [linda/frequency@1, bat_ball/explicit@1]
